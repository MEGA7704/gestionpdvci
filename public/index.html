<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEGA TRÉSORERIE PRO</title><style>body{margin:0;background:#f4f7f5;font:15px system-ui;color:#17392d}header{background:#07543d;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}nav{background:#e0ede6;padding:12px 5%;display:flex;gap:12px;flex-wrap:wrap}button{background:#087957;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0001}input,select{display:block;box-sizing:border-box;width:100%;padding:12px;margin:9px 0;border:1px solid #c9d9d0;border-radius:8px}form{max-width:550px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:10px}#message{color:#a22} .hide{display:none}h1{font-size:21px}small{color:#5d756b}</style></head><body><header><strong>◉ MEGA TRÉSORERIE PRO</strong><span id="who">Gestion PDV Mobile Money</span></header><nav id="nav" class="hide"><button onclick="tab('overview')">Tableau de bord</button><button onclick="tab('pos')">Points de vente</button><button onclick="tab('services')">Services</button><button onclick="tab('movement')">Mouvements</button><button onclick="tab('history')">Historique</button><button onclick="tab('users')">Gérants</button><button onclick="tab('funds')">Fonds</button><button onclick="tab('reports')">Rapports PDF</button><button onclick="tab('close')">Clôture</button><button onclick="tab('corrections')">Corrections</button><button onclick="tab('security')">Sécurité</button><button onclick="tab('subscription')">Abonnement</button><button onclick="tab('super')">Super Admin</button><button onclick="logout()">Déconnexion</button></nav><main><p id="message"></p><section id="auth" class="card"><h1>Connexion</h1><form id="login"><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Mot de passe" required><button>Se connecter</button></form><h2>Inscrire mon entreprise</h2><form id="register"><input name="company" placeholder="Entreprise" required><input name="name" placeholder="Responsable" required><input name="email" type="email" placeholder="E-mail" required><input name="phone" placeholder="Téléphone"><input name="city" placeholder="Ville"><input name="password" type="password" minlength="12" placeholder="Mot de passe (12 caractères minimum)" required><button>Créer l'entreprise</button></form></section><section id="app" class="hide"><div id="content"></div></section></main><script>
let role='',csrf='',data={pos:[],accounts:[],services:[]};const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>Number(x).toLocaleString('fr-FR')+' FCFA';async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-csrf-token':csrf},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}function msg(t){$('message').textContent=t}function formData(f){return Object.fromEntries(new FormData(f))}async function submit(f,path,cb){try{await api(path,formData(f));f.reset();msg('Opération réussie');if(cb)await cb()}catch(e){msg(e.message)}}$('login').onsubmit=async e=>{e.preventDefault();try{const d=await api('login',formData(e.target));csrf=d.csrf;await start()}catch(x){msg(x.message)}};$('register').onsubmit=async e=>{e.preventDefault();await submit(e.target,'register',()=>msg('Entreprise créée. Connectez-vous.'))};async function start(){try{const me=await api('me');csrf=me.csrf;role=me.role;$('auth').classList.add('hide');$('app').classList.remove('hide');$('nav').classList.remove('hide');$('who').textContent=me.name+' · '+me.role;await refresh();tab('overview')}catch{}}async function refresh(){data=await api('overview')}async function logout(){await api('logout',{});location.reload()}const options=(rows,fn)=>rows.map(x=>`<option value="${esc(x.id)}">${esc(fn(x))}</option>`).join('');function tab(t){msg('');let h='';if(t==='overview'){h='<h1>Tableau de bord</h1><div class="card"><h2>Comptes et soldes</h2><table><tr><th>PDV</th><th>Compte</th><th>Solde</th></tr>'+data.accounts.map(a=>`<tr><td>${esc(a.pos_name)}</td><td>${esc(a.service_name||'Espèces')}</td><td>${money(a.balance)}</td></tr>`).join('')+'</table></div>'}if(t==='pos')h=`<div class="card"><h2>Nouveau PDV</h2><form id="newpos"><input name="name" placeholder="Nom du PDV" required><input name="city" placeholder="Localité"><button>Enregistrer</button></form></div><div class="card"><h2>Points de vente</h2>${data.pos.map(p=>'<p>'+esc(p.name)+' — '+esc(p.city)+'</p>').join('')}</div>`;if(t==='services')h=`<div class="card"><h2>Créer un service</h2><form id="newservice"><input name="name" placeholder="Orange Money, Wave..." required><button>Enregistrer</button></form></div><div class="card"><h2>Associer un portefeuille à un PDV</h2><form id="newwallet"><select name="pos_id">${options(data.pos,x=>x.name)}</select><select name="service_id">${options(data.services,x=>x.name)}</select><button>Associer</button></form></div>`;if(t==='movement')h=`<div class="card"><h2>Dépôt ou retrait</h2><form id="newmovement"><select name="pos_id">${options(data.pos,x=>x.name)}</select><select name="service_id">${options(data.services,x=>x.name)}</select><select name="type"><option value="deposit">Dépôt client</option><option value="withdrawal">Retrait client</option></select><input name="amount" type="number" min="1" step="1" placeholder="Montant FCFA" required><input name="note" placeholder="Observation"><button>Valider le mouvement</button></form><small>Les soldes initiaux ne peuvent pas encore être saisis dans cette version.</small></div>`;if(t==='users')h=`<div class=card><h2>Ajouter un gérant</h2><form id=newuser><input name=name placeholder=Nom required><input name=email type=email placeholder=Email required><input name=password type=password minlength=12 placeholder=Mot-de-passe required><button>Créer</button></form></div><div class=card><h2>Affecter un gérant</h2><form id=newassign><select name=pos_id>${options(data.pos,x=>x.name)}</select><select id=agents name=user_id></select><button>Affecter</button></form></div>`;if(t==='funds')h=`<div class=card><h2>Approvisionnement (Administrateur)</h2><form id=newfund><select name=account_id>${options(data.accounts,x=>x.pos_name+' — '+(x.service_name||'Espèces'))}</select><input name=amount type=number min=1 step=1 placeholder='Montant FCFA' required><input name=note placeholder=Justification required><button>Enregistrer</button></form></div>`;if(t==='reports')h=`<div class=card><h2>Rapport PDF professionnel</h2><form id=reportform><label>Date début<input name=start type=date required></label><label>Date fin<input name=end type=date required></label><label>PDV<select name=pos_id><option value=''>Tous les PDV autorisés</option>${options(data.pos,x=>x.name)}</select></label><button>Générer le rapport imprimable PDF</button></form><small>Dans la fenêtre d'impression, choisissez « Enregistrer au format PDF ». Rapport limité à 5 000 lignes : réduisez la période si nécessaire.</small></div>`;if(t==='subscription')h=`<div class=card><h2>Demande d’abonnement</h2><p>Standard 3 900 FCFA · Business 40 900 FCFA · Ultimate 189 900 FCFA</p><form id=newsubscription><select name=plan><option value=standard>Standard</option><option value=business>Business</option><option value=ultimate>Ultimate</option></select><input name=phone placeholder='Numéro Wave utilisé' required><input name=transaction_id placeholder='ID de transaction' required><button>Transmettre au support</button></form></div>`;if(t==='super')h=`<div class=card><h2>Super Admin</h2><div id=superdata></div></div>`;if(t==='close')h=`<div class=card><h2>Clôture journalière de caisse</h2><p>Déclarez tous les soldes constatés. Une clôture empêche les nouveaux mouvements du jour.</p><form id=closeform><select id=closepos name=pos_id onchange=showCloseAccounts()>${options(data.pos,x=>x.name)}</select><div id=closeaccounts></div><input name=note placeholder=Observations><button>Clôturer la caisse</button></form></div><div class=card><h2>Clôtures précédentes</h2><div id=closurelist></div></div>`;
if(t==='corrections')h=`<div class=card><h2>Demander une correction</h2><form id=correctionform><input name=transaction_id placeholder='Identifiant du mouvement' required><input name=reason minlength=8 placeholder='Motif détaillé' required><button>Soumettre</button></form></div><div class=card><h2>Demandes de correction</h2><div id=correctionlist></div></div>`;
if(t==='security')h=`<div class=card><h2>Changer mon mot de passe</h2><form id=changepwd><input type=password name=old_password placeholder='Mot de passe actuel' required><input type=password name=new_password minlength=12 placeholder='Nouveau mot de passe (12 caractères minimum)' required><button>Changer et déconnecter toutes les sessions</button></form></div><div class=card><h2>Réinitialiser un utilisateur autorisé</h2><form id=resetpwd><input name=user_id placeholder='Identifiant utilisateur' required><input type=password name=admin_password placeholder='Votre mot de passe administrateur' required><input type=password name=new_password minlength=12 placeholder='Nouveau mot de passe' required><button>Réinitialiser</button></form></div>`;
if(t==='history'){h='<div class="card"><h2>Historique des mouvements</h2><div id="history"></div><button id="more">Page suivante</button></div>'} $('content').innerHTML=h;for(const [id,path] of [['newpos','pos'],['newservice','service'],['newwallet','wallet'],['newmovement','movement'],['newuser','users'],['newassign','assign'],['newfund','initial-funds'],['newsubscription','subscription-request']]){const f=$(id);if(f)f.onsubmit=async e=>{e.preventDefault();if(['movement','initial-funds'].includes(path)){const body={...formData(f),idempotency_key:crypto.randomUUID()};try{await api(path,body);msg('Opération enregistrée');await refresh();tab(t)}catch(e){msg(e.message)}}else await submit(f,path,async()=>{await refresh();tab(t)})}}if(t==='close'){showCloseAccounts();api('cash/closures').then(d=>{$('closurelist').innerHTML=d.rows.map(x=>`<p>${esc(x.business_date)} · ${esc(x.pos_name)} · ${esc(x.status)}</p>`).join('')||'Aucune clôture'}).catch(e=>msg(e.message));$('closeform').onsubmit=async e=>{e.preventDefault();const f=e.target,b=formData(f),observed={};for(const a of data.accounts.filter(x=>x.pos_id===b.pos_id)){observed[a.id]=Number(f.querySelector('[data-account="'+a.id+'"]').value)}try{await api('cash/close',{pos_id:b.pos_id,note:b.note,observed});msg('Clôture enregistrée');tab('close')}catch(e){msg(e.message)}}}
if(t==='corrections'){api('corrections').then(d=>{$('correctionlist').innerHTML=d.rows.map(x=>`<div class=card><b>${esc(x.transaction_id)}</b> · ${money(x.amount)} · ${esc(x.status)}<p>${esc(x.reason)}</p>${role==='admin'&&x.status==='pending'?`<button onclick="decisionCorrection('${esc(x.id)}','approved')">Approuver</button> <button onclick="decisionCorrection('${esc(x.id)}','rejected')">Rejeter</button>`:''}</div>`).join('')||'Aucune demande'}).catch(e=>msg(e.message));$('correctionform').onsubmit=e=>{e.preventDefault();submit(e.target,'corrections',()=>tab('corrections'))}}
if(t==='security'){$('changepwd').onsubmit=async e=>{e.preventDefault();try{await api('password/change',formData(e.target));location.reload()}catch(x){msg(x.message)}};$('resetpwd').onsubmit=e=>{e.preventDefault();submit(e.target,'password/reset-user')}}
if(t==='reports'){const form=$('reportform');if(form)form.onsubmit=async e=>{e.preventDefault();try{const b=formData(form),q=new URLSearchParams(b),r=await api('report?'+q.toString());printReport(r)}catch(x){msg(x.message)}}}
if(t==='history'){let page=0;async function load(){try{const d=await api('history?page='+page);$('history').innerHTML='<table><tr><th>Date</th><th>PDV</th><th>Type</th><th>Montant</th></tr>'+d.rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.pos_name)}</td><td>${esc(x.type)}</td><td>${money(x.amount)}</td></tr>`).join('')+'</table>'}catch(e){msg(e.message)}}$('more').onclick=()=>{page++;load()};load()}}async function decide(id,decision){try{await api('super/subscription-decision',{id,decision});tab('super')}catch(e){msg(e.message)}}function showCloseAccounts(){const pos=$('closepos')?.value;if(!$('closeaccounts'))return;$('closeaccounts').innerHTML=data.accounts.filter(a=>a.pos_id===pos).map(a=>`<label>${esc(a.service_name||'Espèces')} · théorique ${money(a.balance)}<input data-account="${esc(a.id)}" type=number min=0 step=1 required placeholder='Montant constaté'></label>`).join('')}
async function decisionCorrection(id,decision){const password=prompt('Mot de passe administrateur pour confirmer :');if(!password)return;try{await api('corrections/decide',{id,decision,password});msg('Décision enregistrée');await refresh();tab('corrections')}catch(e){msg(e.message)}}
function printReport(r){const win=window.open('','_blank');if(!win){msg('Autorisez les fenêtres contextuelles pour imprimer');return}const rows=r.rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.pos_name)}</td><td>${esc(x.service_name||'Espèces')}</td><td>${esc(x.type)}</td><td>${money(x.amount)}</td><td>${esc(x.actor_name)}</td></tr>`).join('');const total=r.rows.reduce((a,x)=>a+Number(x.amount),0);win.document.write(`<!doctype html><html lang=fr><head><meta charset=utf-8><title>Rapport trésorerie</title><style>@page{size:A4 landscape;margin:15mm}body{font:11px Arial;color:#172d27}header{border-bottom:3px solid #07543d;padding:12px 0;margin-bottom:20px}h1{color:#07543d}table{width:100%;border-collapse:collapse}th{background:#07543d;color:white}th,td{padding:8px;border:1px solid #ccc;text-align:left}thead{display:table-header-group}tr{break-inside:avoid}.sign{margin-top:50px;text-align:right}@media print{button{display:none}}</style></head><body><header><h1>${esc(r.company?.name||'Entreprise')}</h1><p>${esc(r.company?.city||'')} · ${esc(r.company?.phone||'')}</p><h2>RAPPORT DES MOUVEMENTS DE TRÉSORERIE</h2><p>Période : ${esc(r.start)} au ${esc(r.end)} · Édité le ${esc(r.generated_at)} · Réf. ${esc(crypto.randomUUID())}</p></header>${r.limited?'<p>Attention : rapport tronqué à 5 000 lignes, réduire la période.</p>':''}<table><thead><tr><th>Date</th><th>PDV</th><th>Service</th><th>Opération</th><th>Montant</th><th>Gérant</th></tr></thead><tbody>${rows}</tbody></table><h3>Nombre de mouvements : ${r.rows.length} · Total des montants des mouvements (non assimilable à un solde) : ${money(total)}</h3><div class=sign>Fait le ${new Date().toLocaleDateString('fr-FR')}<p>Signature et cachet : __________________</p></div><button onclick=print()>Imprimer / PDF</button></body></html>`);win.document.close();win.focus()}
start();
</script></body></html>
